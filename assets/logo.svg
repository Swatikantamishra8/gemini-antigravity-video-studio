<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for studio badge -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Safe Margin (10% padding: bounding box 52 to 460) -->
  <g filter="url(#shadow)">
    <!-- Outer Rounded Film / Studio Frame -->
    <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#primaryGrad)" />
    
    <!-- Isometric 3D Film Wireframe / Play Geometry -->
    <!-- Top Face -->
    <path d="M 256 128 L 368 192 L 256 256 L 144 192 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <path d="M 144 192 L 256 256 L 256 384 L 144 320 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <path d="M 256 256 L 368 192 L 368 320 L 256 384 Z" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Center Glowing Play Shutter -->
    <polygon points="228,212 316,262 228,312" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Orbiting Studio Particles (3D Motion Markers) -->
    <circle cx="144" cy="192" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="368" cy="192" r="10" fill="#F43F5E" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="256" cy="384" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="256" cy="128" r="10" fill="#A855F7" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Dynamic Audio Wave Accent at base -->
    <rect x="180" y="412" width="12" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="204" y="402" width="12" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="228" y="394" width="12" height="42" rx="6" fill="#FFFFFF"/>
    <rect x="252" y="388" width="12" height="48" rx="6" fill="#FFFFFF"/>
    <rect x="276" y="394" width="12" height="42" rx="6" fill="#FFFFFF"/>
    <rect x="300" y="402" width="12" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="324" y="412" width="12" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>
